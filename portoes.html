<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portões - Gates N Fences</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <span class="sr-only">Catálogo de linhas de portões oferecidos pela Gates N Fences.</span>

    <header>
        <a href="index.html" class="logo" aria-label="Gates N Fences - Ir para página inicial">Gates N Fences</a>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="portoes.html" style="color: var(--cor-accent);" aria-current="page">Portões</a></li>
                <li><a href="#">Segurança</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section class="secao">
        <h1 class="titulo-secao">Nossas Linhas de Portões</h1>
        <div class="grid">
            <div class="card">
                <div class="img-placeholder" role="img" aria-label="Foto de demonstração da Linha Moderna"></div>
                <h3>Linha Moderna</h3>
            </div>
            
            <a href="produto.html" class="card" aria-label="Acessar página de Projetos Customizados">
                <div class="img-placeholder" role="img" aria-label="Foto de demonstração dos Projetos Customizados"></div>
                <h3>Projetos Customizados</h3>
            </a>

            <div class="card">
                <div class="img-placeholder" role="img" aria-label="Foto de demonstração da Linha Privacidade Total"></div>
                <h3>Linha Privacidade Total</h3>
            </div>
        </div>
    </section>
</body>
</html>
